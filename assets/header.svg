<svg xmlns="http://www.w3.org/2000/svg" width="860" height="170" viewBox="0 0 860 170" role="img" aria-label="Gabriel Mouta: Automação, Integrações e Ferramentas internas. Se faz duas vezes, automatiza.">
  <style>
    .t { font: 700 26px 'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace; fill: #fff; }
    .s { font: 500 15px 'Segoe UI',-apple-system,Helvetica,Arial,sans-serif; fill: #e8f6ff; opacity: .92; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"><animate attributeName="stop-color" dur="12s" repeatCount="indefinite" values="#0ea5e9;#7c3aed;#db2777;#0ea5e9"/></stop>
      <stop offset=".5" stop-color="#6366f1"><animate attributeName="stop-color" dur="12s" repeatCount="indefinite" values="#6366f1;#0ea5e9;#7c3aed;#6366f1"/></stop>
      <stop offset="1" stop-color="#14b8a6"><animate attributeName="stop-color" dur="12s" repeatCount="indefinite" values="#14b8a6;#6366f1;#0ea5e9;#14b8a6"/></stop>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <clipPath id="card"><rect width="860" height="170" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="860" height="170" fill="url(#bg)"/>
    <circle r="140" cy="30" fill="url(#glow)"><animate attributeName="cx" dur="9s" repeatCount="indefinite" values="-140;1000;-140"/></circle>
    <circle r="90" cy="150" fill="url(#glow)"><animate attributeName="cx" dur="13s" repeatCount="indefinite" values="950;-90;950"/></circle>
    <path fill="#ffffff" fill-opacity=".10" d="M0 140 Q 215 115 430 140 T 860 140 V170 H0 Z">
      <animate attributeName="d" dur="6s" repeatCount="indefinite" values="M0 140 Q 215 115 430 140 T 860 140 V170 H0 Z;M0 140 Q 215 165 430 140 T 860 140 V170 H0 Z;M0 140 Q 215 115 430 140 T 860 140 V170 H0 Z"/>
    </path>
    
  <clipPath id="c0"><rect x="172.0" y="40" height="70" width="0">
    <animate attributeName="width" dur="12.0s" repeatCount="indefinite" keyTimes="0.0;0.1333;0.2833;0.3167;1" values="0.0;518.0;518.0;0.0;0.0"/>
  </rect></clipPath>
  <text x="430.0" y="84" text-anchor="middle" dominant-baseline="middle" class="t" clip-path="url(#c0)">Olá, eu sou o Gabriel Mouta 👋</text>
  <rect y="67" width="3" height="34" rx="1.5" fill="#fff" opacity="0">
    <animate attributeName="x" dur="12.0s" repeatCount="indefinite" keyTimes="0.0;0.1333;0.2833;0.3167;1" values="172.0;690.0;690.0;172.0;172.0"/>
    <animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.0;0.3167" values="0;1;0"/>
  </rect>
  <clipPath id="c1"><rect x="37.6" y="40" height="70" width="0">
    <animate attributeName="width" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.3333;0.4667;0.6167;0.65;1" values="0.0;0.0;786.8;786.8;0.0;0.0"/>
  </rect></clipPath>
  <text x="430.0" y="84" text-anchor="middle" dominant-baseline="middle" class="t" clip-path="url(#c1)">Automação + Integrações + Ferramentas internas</text>
  <rect y="67" width="3" height="34" rx="1.5" fill="#fff" opacity="0">
    <animate attributeName="x" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.3333;0.4667;0.6167;0.65;1" values="37.6;37.6;824.4;824.4;37.6;37.6"/>
    <animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3333;0.65" values="0;1;0"/>
  </rect>
  <clipPath id="c2"><rect x="172.0" y="40" height="70" width="0">
    <animate attributeName="width" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.6667;0.8;0.95;0.9833;1" values="0.0;0.0;518.0;518.0;0.0;0.0"/>
  </rect></clipPath>
  <text x="430.0" y="84" text-anchor="middle" dominant-baseline="middle" class="t" clip-path="url(#c2)">Se faz duas vezes, automatiza.</text>
  <rect y="67" width="3" height="34" rx="1.5" fill="#fff" opacity="0">
    <animate attributeName="x" dur="12.0s" repeatCount="indefinite" keyTimes="0;0.6667;0.8;0.95;0.9833;1" values="172.0;172.0;690.0;690.0;172.0;172.0"/>
    <animate attributeName="opacity" dur="12.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.6667;0.9833" values="0;1;0"/>
  </rect>
    <text x="430.0" y="132" text-anchor="middle" class="s">Ferramentas internas de TI · GLPI · Chatwoot · WhatsApp · AD · São Luís, MA</text>
  </g>
</svg>
